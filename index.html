<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Multi-Sucursal - Pet Shop & Gas</title>
    <style>
        :root { --primary: #2c3e50; --secondary: #3498db; --success: #27ae60; --danger: #e74c3c; --warning: #f39c12; --bg: #f4f7f6; --dark: #1a252f; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 0; color: #333; }
        
        /* Login Overlay */
        #login-screen { position: fixed; top:0; left:0; width: 100%; height: 100%; background: var(--dark); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .login-box { background: white; padding: 30px; border-radius: 10px; text-align: center; width: 300px; }
        .login-box input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;}
        .login-box button { background: var(--primary); color: white; border: none; padding: 10px; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; }

        /* Layout Principal */
        #app-content { display: none; }
        .navbar { background: var(--primary); padding: 15px 20px; color: white; display: flex; justify-content: space-between; align-items: center; }
        .nav-links button { background: none; border: none; color: #bdc3c7; font-size: 1rem; cursor: pointer; padding: 5px 10px; margin-right: 5px; transition: 0.3s; }
        .nav-links button.active, .nav-links button:hover { color: white; border-bottom: 2px solid var(--secondary); font-weight: bold; }
        
        .container { max-width: 1100px; margin: 20px auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Controles Generales */
        input, select { padding: 10px; border-radius: 5px; border: 1px solid #ddd; outline: none; }
        .btn { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; }
        .btn-green { background: var(--success); } .btn-blue { background: var(--secondary); } .btn-yellow { background: var(--warning); color: #333; } .btn-red { background: var(--danger); }
        
        /* Buscador y Tabla */
        .search-container { position: relative; margin-bottom: 15px; display: flex; gap: 10px; }
        .search-container input { flex-grow: 1; border: 2px solid var(--secondary); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #f8f9fa; padding: 10px; text-align: left; border-bottom: 2px solid #eee; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        
        /* Grid de Resumen */
        .summary-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-top: 20px; }
        .summary-box { background: #f9f9f9; padding: 20px; border-radius: 8px; border: 1px solid #eee; }
        .total-row { display: flex; justify-content: space-between; margin-bottom: 10px; align-items: center; }
        .grand-total { font-size: 2rem; color: var(--success); font-weight: bold; }

        /* Utilities */
        .badge { padding: 3px 8px; border-radius: 12px; font-size: 0.8rem; background: #eee; }
        .text-right { text-align: right; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h2>Pet Shop & Gas</h2>
        <p>Ingreso al Sistema</p>
        <select id="login-sucursal">
            <option value="Principal">Sucursal Principal</option>
            <option value="Norte">Sucursal Norte</option>
            <option value="Sur">Sucursal Sur</option>
        </select>
        <input type="password" id="login-pass" placeholder="Clave de acceso (1234)">
        <button onclick="login()">Ingresar</button>
    </div>
</div>

<div id="app-content">
    <div class="navbar">
        <div style="display: flex; align-items: center; gap: 20px;">
            <h3 style="margin: 0;">Gestión Pro</h3>
            <span class="badge" id="lbl-sucursal">Sucursal</span>
            <span class="badge" id="lbl-rol" style="background: var(--warning); color: #333;">Admin</span>
        </div>
        <div class="nav-links">
            <button class="active" onclick="cambiarTab('ventas', this)">🛒 Ventas</button>
            <button onclick="cambiarTab('compras', this)">📦 Compras & Inventario</button>
            <button onclick="cambiarTab('reportes', this)">📊 Reportes</button>
            <button onclick="salir()" style="color: var(--danger);">✖ Salir</button>
        </div>
    </div>

    <div id="tab-ventas" class="container tab-content active">
        <div class="search-container">
            <input type="text" id="buscador" placeholder="🔍 Buscar producto para vender..." oninput="buscar('buscador', 'lista-ventas')" autocomplete="off">
            <button class="btn btn-yellow" onclick="guardarPendiente()">⏸ Pausar Venta</button>
            <button class="btn btn-blue" onclick="cargarPendiente()">▶ Recuperar Venta</button>
        </div>
        <div id="lista-ventas" style="position: absolute; background: white; width: 60%; box-shadow: 0 5px 15px rgba(0,0,0,0.1); display: none; z-index: 10;"></div>

        <div class="summary-grid">
            <div>
                <table>
                    <thead><tr><th>Producto</th><th>Cantidad</th><th>Precio U.</th><th>Subtotal</th><th></th></tr></thead>
                    <tbody id="carrito-body"></tbody>
                </table>
            </div>
            <div class="summary-box">
                <div class="total-row"><span>Pago:</span>
                    <select id="metodo-pago" onchange="calcularVenta()"><option value="efectivo">Efectivo</option><option value="tarjeta">Tarjeta (+15%)</option></select>
                </div>
                <div class="total-row"><span>Descuento $:</span><input type="number" id="desc-venta" value="0" style="width:80px" oninput="calcularVenta()"></div>
                <hr>
                <div class="total-row"><span>Subtotal:</span><span id="sub-v">$0.00</span></div>
                <div class="total-row"><strong>TOTAL:</strong><span id="tot-v" class="grand-total">$0.00</span></div>
                <button class="btn btn-green" style="width: 100%; margin-top: 15px; font-size: 1.2rem;" onclick="finalizarVenta()">Cobrar e Imprimir</button>
                <button class="btn btn-blue" style="width: 100%; margin-top: 10px;" onclick="enviarCatalogoWP()">📱 Enviar Catálogo por WhatsApp</button>
            </div>
        </div>
    </div>

    <div id="tab-compras" class="container tab-content">
        <h3>Gestión de Mercadería</h3>
        <div class="summary-grid">
            <div>
                <h4>Ingresar Nueva Compra (Proveedor)</h4>
                <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <input type="text" id="nuevo-prod" placeholder="Nombre del Producto" style="flex-grow: 1;">
                    <input type="number" id="nuevo-costo" placeholder="Costo $" style="width: 100px;">
                    <input type="number" id="nuevo-precio" placeholder="Precio Venta $" style="width: 120px;">
                </div>
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="nuevo-stock" placeholder="Cantidad que ingresa" style="width: 150px;">
                    <button class="btn btn-green" onclick="ingresarMercaderia()">+ Cargar al Stock</button>
                </div>
            </div>
            <div class="summary-box">
                <h4>Inventario Actual (<span id="lbl-inv-sucursal"></span>)</h4>
                <div id="lista-inventario" style="max-height: 300px; overflow-y: auto; font-size: 0.9rem;"></div>
            </div>
        </div>
    </div>

    <div id="tab-reportes" class="container tab-content">
        <h3>Cierre de Caja y Reportes</h3>
        <table style="width: 100%;">
            <thead><tr><th>Hora</th><th>Operación</th><th>Detalle</th><th>Total</th></tr></thead>
            <tbody id="historial-body"></tbody>
        </table>
        <h2 class="text-right" style="color: var(--success); margin-top: 20px;">Total Caja: <span id="caja-total">$0.00</span></h2>
    </div>
</div>

<script>
    // BASE DE DATOS LOCAL SIMULADA
    let inventario = JSON.parse(localStorage.getItem('inventario')) || [
        { id: 1, nombre: "Alimento Perro Premium", costo: 1500, precio: 2500, stock: 50 }
    ];
    let ventasHistorial = JSON.parse(localStorage.getItem('ventasHistorial')) || [];
    let carrito = [];
    let ventaPendiente = null;
    let sucursalActual = "";

    // --- NAVEGACIÓN Y LOGIN ---
    function login() {
        const pass = document.getElementById('login-pass').value;
        if(pass === '1234') {
            sucursalActual = document.getElementById('login-sucursal').value;
            document.getElementById('lbl-sucursal').innerText = sucursalActual;
            document.getElementById('lbl-inv-sucursal').innerText = sucursalActual;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
            actualizarInventarioUI();
            actualizarReportes();
        } else { alert("Clave incorrecta. Usa 1234"); }
    }

    function salir() { location.reload(); }

    function cambiarTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-links button').forEach(b => b.classList.remove('active'));
        document.getElementById(`tab-${tabId}`).classList.add('active');
        btn.classList.add('active');
    }

    // --- MÓDULO VENTAS ---
    function buscar(inputId, listaId) {
        const t = document.getElementById(inputId).value.toLowerCase();
        const lista = document.getElementById(listaId);
        lista.innerHTML = "";
        if(t.length < 2) { lista.style.display = "none"; return; }
        
        const res = inventario.filter(p => p.nombre.toLowerCase().includes(t));
        if(res.length > 0) {
            lista.style.display = "block";
            res.forEach(p => {
                lista.innerHTML += `<div style="padding:10px; border-bottom:1px solid #eee; cursor:pointer;" onclick="agregarAlCarrito(${p.id})">
                    <b>${p.nombre}</b> - $${p.precio} (Stock: ${p.stock})
                </div>`;
            });
        }
    }

    function agregarAlCarrito(id) {
        const prod = inventario.find(p => p.id === id);
        carrito.push({ ...prod, uuid: Date.now(), cant: 1, sub: prod.precio });
        document.getElementById('lista-ventas').style.display = "none";
        document.getElementById('buscador').value = "";
        renderCarrito();
    }

    function actFila(uuid, val) {
        const i = carrito.find(x => x.uuid === uuid);
        i.cant = parseFloat(val) || 0;
        i.sub = i.cant * i.precio;
        renderCarrito();
    }

    function eliminar(uuid) { carrito = carrito.filter(x => x.uuid !== uuid); renderCarrito(); }

    function renderCarrito() {
        const body = document.getElementById('carrito-body');
        body.innerHTML = carrito.map(i => `
            <tr>
                <td>${i.nombre}</td>
                <td><input type="number" value="${i.cant}" step="0.01" style="width:70px" onchange="actFila(${i.uuid}, this.value)"></td>
                <td>$${i.precio}</td>
                <td>$${i.sub.toFixed(2)}</td>
                <td><button onclick="eliminar(${i.uuid})" style="background:none; border:none; color:red; cursor:pointer">✖</button></td>
            </tr>
        `).join('');
        calcularVenta();
    }

    function calcularVenta() {
        let st = carrito.reduce((acc, i) => acc + i.sub, 0);
        let desc = parseFloat(document.getElementById('desc-venta').value) || 0;
        let rec = document.getElementById('metodo-pago').value === 'tarjeta' ? st * 0.15 : 0;
        let total = st + rec - desc;
        
        document.getElementById('sub-v').innerText = `$${st.toFixed(2)}`;
        document.getElementById('tot-v').innerText = `$${total.toFixed(2)}`;
        return total;
    }

    function finalizarVenta() {
        if(carrito.length === 0) return;
        const total = calcularVenta();
        
        // Simular descuento de stock
        carrito.forEach(item => {
            let invItem = inventario.find(p => p.id === item.id);
            if(invItem) invItem.stock -= item.cant;
        });
        localStorage.setItem('inventario', JSON.stringify(inventario));

        // Guardar Historial
        ventasHistorial.push({ fecha: new Date().toLocaleString(), tipo: 'Venta', sucursal: sucursalActual, detalle: carrito.map(i => i.nombre).join(', '), total: total });
        localStorage.setItem('ventasHistorial', JSON.stringify(ventasHistorial));

        alert("Venta procesada con éxito.");
        carrito = [];
        document.getElementById('desc-venta').value = 0;
        renderCarrito();
        actualizarInventarioUI();
        actualizarReportes();
    }

    // Funciones de Venta Pendiente
    function guardarPendiente() {
        if(carrito.length === 0) return alert("No hay venta para pausar");
        ventaPendiente = [...carrito];
        carrito = [];
        renderCarrito();
        alert("Venta guardada en pausa.");
    }
    function cargarPendiente() {
        if(!ventaPendiente) return alert("No hay ventas pausadas");
        carrito = [...ventaPendiente];
        ventaPendiente = null;
        renderCarrito();
    }

    // Catálogo WhatsApp
    function enviarCatalogoWP() {
        let texto = "Hola! Te comparto nuestra lista de precios actualizada:\n\n";
        inventario.forEach(p => texto += `🐾 ${p.nombre}: $${p.precio}\n`);
        texto += "\nRespondé este mensaje con tu pedido!";
        let url = `https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`;
        window.open(url, '_blank');
    }

    // --- MÓDULO COMPRAS E INVENTARIO ---
    function ingresarMercaderia() {
        const nom = document.getElementById('nuevo-prod').value;
        const costo = parseFloat(document.getElementById('nuevo-costo').value);
        const pre = parseFloat(document.getElementById('nuevo-precio').value);
        const cant = parseFloat(document.getElementById('nuevo-stock').value);

        if(!nom || !pre || !cant) return alert("Faltan datos");

        inventario.push({ id: Date.now(), nombre: nom, costo: costo || 0, precio: pre, stock: cant });
        localStorage.setItem('inventario', JSON.stringify(inventario));
        
        document.getElementById('nuevo-prod').value = "";
        document.getElementById('nuevo-costo').value = "";
        document.getElementById('nuevo-precio').value = "";
        document.getElementById('nuevo-stock').value = "";
        
        actualizarInventarioUI();
        alert("Mercadería ingresada al sistema");
    }

    function actualizarInventarioUI() {
        const div = document.getElementById('lista-inventario');
        div.innerHTML = inventario.map(p => `
            <div style="display:flex; justify-content:space-between; border-bottom:1px solid #ddd; padding:5px 0;">
                <span>${p.nombre}</span>
                <span>Stock: <b>${p.stock}</b> | $${p.precio}</span>
            </div>
        `).join('');
    }

    // --- MÓDULO REPORTES ---
    function actualizarReportes() {
        const body = document.getElementById('historial-body');
        let total = 0;
        body.innerHTML = ventasHistorial.slice().reverse().map(v => {
            total += v.total;
            return `<tr><td>${v.fecha}</td><td>${v.tipo} (${v.sucursal})</td><td>${v.detalle}</td><td>$${v.total.toFixed(2)}</td></tr>`;
        }).join('');
        document.getElementById('caja-total').innerText = `$${total.toFixed(2)}`;
    }
</script>

</body>
</html>
